<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MIDTOWN / LOCKDOWN</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Big+Shoulders+Stencil+Text:wght@800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./src/style.css" />
  <script type="module" src="./src/main.js"></script>
</head>
<body>
  <canvas id="game"></canvas>

  <!-- ================= HUD ================= -->
  <div id="hud" class="hud hidden">
    <div id="crosshair" class="crosshair">
      <div class="ch-line ch-t"></div>
      <div class="ch-line ch-b"></div>
      <div class="ch-line ch-l"></div>
      <div class="ch-line ch-r"></div>
      <div class="ch-dot"></div>
    </div>
    <div id="hitmarker" class="hitmarker">
      <span class="hm hm-1"></span><span class="hm hm-2"></span><span class="hm hm-3"></span><span class="hm hm-4"></span>
    </div>
    <div id="dmg-indicators" class="dmg-indicators"></div>

    <div id="hud-bl" class="hud-bl">
      <div class="hp-wrap">
        <div class="hp-label">VITALS</div>
        <div class="hp-bar"><div id="hp-fill" class="hp-fill"></div></div>
      </div>
      <div class="stat-row">
        <div class="stat"><span class="stat-k">WAVE</span><span id="st-wave" class="stat-v">1</span></div>
        <div class="stat"><span class="stat-k">HOSTILES</span><span id="st-enemies" class="stat-v">0</span></div>
        <div class="stat"><span class="stat-k">KILLS</span><span id="st-kills" class="stat-v">0</span></div>
      </div>
    </div>

    <div id="hud-br" class="hud-br">
      <div id="wpn-name" class="wpn-name">VK-7 ASSAULT RIFLE</div>
      <div class="ammo-row">
        <span id="ammo-mag" class="ammo-mag">30</span>
        <span class="ammo-sep">/</span>
        <span id="ammo-res" class="ammo-res">120</span>
      </div>
      <div class="wpn-slots" id="wpn-slots">
      </div>
      <div id="fire-mode" class="fire-mode">AUTO</div>
    </div>

    <div id="hud-tr" class="hud-tr">
      <div id="score" class="score">0</div>
      <div id="feed" class="feed"></div>
    </div>

    <div id="banner" class="banner"><div id="banner-main" class="banner-main"></div><div id="banner-sub" class="banner-sub"></div></div>
    <div id="hint" class="hint"></div>
    <div id="popups" class="popups"></div>
    <div id="lowhp" class="lowhp"></div>
  </div>

  <!-- ================= MENUS ================= -->
  <div id="menu" class="menu">
    <div class="menu-inner">
      <div id="menu-main">
        <h1 class="title">MIDTOWN / LOCKDOWN</h1>
        <div class="subtitle">TIMES SQUARE · NEW YORK CITY</div>
        <button id="btn-start" class="btn-start">DEPLOY</button>
        <div id="pause-actions" class="pause-actions hidden">
          <button type="button" id="btn-restart" class="btn-secondary">RESTART</button>
          <button type="button" id="btn-exit-menu" class="btn-secondary">EXIT TO MENU</button>
        </div>
        <div class="menu-buttons">
          <button id="btn-armory" class="btn-secondary">ARMORY</button>
          <button id="btn-controls" class="btn-secondary">HOW TO PLAY</button>
          <button id="btn-settings" class="btn-secondary">SETTINGS</button>
        </div>
        <div id="loadout-strip" class="loadout-strip"></div>
        <label class="callsign">
          <span>PLAYER NAME</span>
          <input id="player-name" type="text" maxlength="16" placeholder="YOUR NAME" autocomplete="nickname" />
        </label>
        <div id="prize" class="prize hidden">
          <span class="prize-copy">HIGHEST SCORE TODAY WINS</span>
          <span class="prize-tag">$10</span>
          <span id="prize-clock" class="prize-clock"></span>
        </div>
        <div id="leaderboard" class="leaderboard"></div>
        <div id="controls-summary" class="controls"></div>
        <button type="button" id="btn-feedback" class="btn-feedback">PROVIDE FEEDBACK</button>
        <div id="feedback-panel" class="feedback-panel hidden">
          <label class="feedback-field">
            <span>NAME <em>(optional)</em></span>
            <input id="feedback-name" type="text" maxlength="16" autocomplete="nickname" />
          </label>
          <label class="feedback-field">
            <span>WHAT SHOULD I FIX OR ADD?</span>
            <textarea id="feedback-body" maxlength="2000" rows="5"></textarea>
          </label>
          <div class="feedback-actions">
            <button type="button" id="feedback-cancel" class="btn-feedback-ghost">CANCEL</button>
            <button type="button" id="feedback-send" class="btn-feedback-send">SEND</button>
          </div>
          <p id="feedback-status" class="feedback-status"></p>
        </div>
        <div id="menu-stats" class="menu-stats hidden"></div>
        <div id="run-summary" class="run-summary hidden"></div>
        <div id="run-actions" class="run-actions hidden">
          <button id="btn-dl-run" class="btn-secondary">DOWNLOAD RUN LOG</button>
          <button id="btn-dl-all" class="btn-secondary">DOWNLOAD ALL RUNS</button>
        </div>
      </div>
      <div id="armory-panel" class="settings armory-panel hidden">
        <div class="settings-title">ARMORY</div>
        <div id="armory-body" class="armory-body"></div>
        <div class="settings-actions">
          <button type="button" id="btn-armory-back" class="btn-secondary">BACK</button>
        </div>
      </div>
      <div id="controls-panel" class="settings controls-panel hidden">
        <div class="settings-title">HOW TO PLAY</div>
        <div id="controls-body" class="controls-body"></div>
        <div class="settings-actions">
          <button type="button" id="btn-controls-back" class="btn-secondary">BACK</button>
        </div>
      </div>
      <div id="settings" class="settings hidden">
        <div class="settings-title">SETTINGS</div>
        <div id="settings-rows" class="settings-rows"></div>
        <div class="settings-actions">
          <button id="btn-settings-reset" class="btn-secondary">RESET DEFAULTS</button>
          <button id="btn-settings-back" class="btn-secondary">BACK</button>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
